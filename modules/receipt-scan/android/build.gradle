plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.receiptscan'
version = '0.1.0'

android {
  namespace "expo.modules.receiptscan"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // On-device text recognition for Latin script. The photo never leaves the phone.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
